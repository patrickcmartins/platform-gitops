{{- range .Values.topics }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ .name | replace "." "-" }}
  labels:
    strimzi.io/cluster: {{ $.Values.name }}
spec:
  topicName: {{ .name }}
  partitions: {{ .partitions }}
  replicas: {{ .replicas }}
  config: {{- toYaml .config | nindent 4 }}
{{- end }}
