# Gateway compartilhado (dono: plataforma). Apps só criam VirtualServices
# apontando para istio-ingress/public-gateway.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: public-gateway
  namespace: istio-ingress
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        {{- range .Values.hosts }}
        - {{ printf "*/%s" . | quote }}
        {{- end }}
      {{- if .Values.tls.credentialName }}
      # Com TLS ligado, HTTP só redireciona (301) para HTTPS.
      tls:
        httpsRedirect: true
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        {{- range .Values.hosts }}
        - {{ printf "*/%s" . | quote }}
        {{- end }}
      tls:
        mode: SIMPLE
        # Secret no namespace do gateway, emitido e renovado pelo cert-manager (charts/cluster-tls).
        credentialName: {{ .Values.tls.credentialName }}
        minProtocolVersion: TLSV1_2
      {{- end }}
