# kind não tem LoadBalancer: NodePort fixo + extraPortMappings do cluster kind.
gateway:
  service:
    type: NodePort
    ports:
      - { name: status-port, port: 15021, targetPort: 15021, protocol: TCP }
      - { name: http2, port: 80, targetPort: 8080, nodePort: 30080, protocol: TCP }
      - { name: https, port: 443, targetPort: 8443, nodePort: 30443, protocol: TCP }
  nodeSelector:
    ingress-ready: "true"
  tolerations:
    - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }

meshConfig:
  hosts: ["*.localtest.me"]   # *.localtest.me resolve para 127.0.0.1
