# Prod: mais folga para o control plane do mesh.
istio:
  pilotResources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 2Gi }
  # Tracing do mesh -> OTel Collector (instalado pelo ApplicationSet observability).
  extensionProviders:
    - name: otel
      opentelemetry:
        service: otel-collector.observability.svc.cluster.local
        port: 4317

meshConfig:
  # Só os nomes do ambiente: o external-dns cria *.prod.patricktf.neosix.me -> NLB deste gateway.
  hosts: ["*.prod.patricktf.neosix.me"]
  tls:
    credentialName: wildcard-tls
  tracing:
    enabled: true
    samplingPercentage: 100   # lab; em produção 1-10% aqui e tail sampling no Collector
