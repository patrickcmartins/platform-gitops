# AppProjects = fronteiras de permissão (menor privilégio).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: "Addons de cluster (Istio, config do mesh, observabilidade, mensageria, DNS/TLS), dono: time de plataforma"
  sourceRepos:
    - https://github.com/patrickcmartins/platform-gitops.git
    - https://istio-release.storage.googleapis.com/charts
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    - https://strimzi.io/charts/
    - https://charts.jetstack.io
    - https://kubernetes-sigs.github.io/external-dns/
  destinations:
    - { server: "*", namespace: istio-system }
    - { server: "*", namespace: istio-ingress }
    - { server: "*", namespace: observability }
    - { server: "*", namespace: kafka }
    - { server: "*", namespace: cert-manager }
    - { server: "*", namespace: external-dns }
    - { server: "*", namespace: kube-system }   # kube-prometheus-stack cria Services de scrape aqui
    - { server: "https://kubernetes.default.svc", namespace: argocd }
  clusterResourceWhitelist:
    - { group: "*", kind: "*" }
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: "Aplicações de negócio, só recursos namespaced em namespaces permitidos"
  sourceRepos:
    - https://github.com/patrickcmartins/sample-app-deploy.git
  destinations:
    - { server: "*", namespace: "sample" }
  clusterResourceWhitelist:
    - { group: "", kind: Namespace }
  namespaceResourceBlacklist:
    - { group: "", kind: ResourceQuota }
    - { group: "", kind: LimitRange }
